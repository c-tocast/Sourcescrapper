name: Actualizar Base de Conocimiento del Gem

on:
  workflow_dispatch: 
  push:
    paths:
      - 'urls.txt'

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el Scrapper
        run: python scraper.py

      - name: Guardar los archivos en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add knowledge/*
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar conocimientos desde URLs oficiales"
          git push

      - name: Copiar archivos al Repositorio Destino
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DESTINATION_REPO_TOKEN }}
        with:
          source_file: 'knowledge'
          destination_repo: 'c-tocast/PCE-Sourcefeeding'
          destination_folder: 'Knowledge'
          user_email: 'david.tocoche@gmail.com'
          user_name: 'c-tocast'
          commit_message: 'Sincronización automática de archivos base de conocimiento'
          destination_branch: 'main'
