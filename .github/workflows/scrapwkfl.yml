name: Actualizar Base de Conocimiento del Gem

# ¿Cuándo se ejecutará este script?
on:
  # 1. Permite ejecutar el script manualmente desde la pestaña Actions
  workflow_dispatch: 
    
  # 2. Ejecuta el script cada vez que modifiques el archivo urls.txt
  push:
    paths:
      - 'urls.txt'

# ¿Qué trabajos realizará?
jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest # Usa un servidor Linux de GitHub

    steps:
      # Paso 1: Descargar el código de tu repositorio al servidor
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar Python en el servidor
      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Puedes usar la versión que prefieras

      # Paso 3: Instalar las dependencias (requests y beautifulsoup4)
      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Paso 4: Ejecutar tu script
      - name: Ejecutar el Scrapper
        run: python scraper.py

      # Paso 5: Subir los nuevos archivos .md generados al repositorio
      - name: Guardar los archivos en GitHub
        run: |
          # Configura el usuario que hará el commit (es el bot de GitHub Actions)
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Añade todos los archivos nuevos o modificados en la carpeta knowledge
          git add knowledge/*
          
          # Hace el commit solo si hay cambios reales. Si las webs no cambiaron, no hace nada.
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar conocimientos desde URLs oficiales"
          git push
